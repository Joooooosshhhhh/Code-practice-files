<!DOCTYPE html>
<html>
<head>
    <title>Invoice Form</title>
    <link rel="stylesheet" href="Invoice.css">
</head>
<body>
    <Div class="container">
        <div class="container1">
            <h1>Invoice Request Form</h1>
            <div class="name-section">
                <div class="name">Name</div>
                <div class="nameTextbox">
                    <input class="namebox" type="text" placeholder="First name">
                    <input class="namebox" type="text" placeholder="Last name">
                </div>
            </div>
            <div class="company">
                <div class="companyName">
                    Company Name
                </div>
                <input class="companybox" type="text" placeholder="Company Name">
            </div>
            <div class="EmailandPhone">
                <div class="EmailSection">
                    <div>
                        Email
                    </div>
                    <input class="companybox" type="text" placeholder="######@gmail.com">
                </div>
                <div class="PhoneSection">
                    <div>
                        Phone
                    </div>
                    <input class="companybox" type="text" placeholder="####-###-####">
                </div>
            </div>
            <div class="Address">
                <div>Address</div>
                <input class="Streetbox" type="text" placeholder="Street Address">
                <input class="Streetline2box" type="text" placeholder="Street Address Line #2">
                <div class="City-Region">
                    <input class="City-Region-box" type="text" placeholder="City">
                    <input class="City-Region-box" type="text" placeholder="Region">
                </div>
                <div class="City-Region">
                    <input class="City-Region-box" type="text" placeholder="Zip Code">
                    <input class="City-Region-box" type="text" placeholder="Philippines">
                </div>
            </div>
            <button>Continue</button>
        </div>
    </div>
</body>
</html>
