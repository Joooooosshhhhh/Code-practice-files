.p_number {

    padding: 10px;
    margin-right: 10px;
    border-radius: 25px;
    border-style: none;
    font-size: 18px;
}

.donation {
    display: flex;
    margin-top: 20px;
    flex-direction: column;
}

.donation-text {
    color: white;
    margin-bottom: 5px;
    font-size: 18px;
}

.donation-placeholder {
    margin-right: 10px;
    color: white;
    font-size: 18px;
    width: 570px;
    height: 25px;
    padding: 10px;
    margin-right: 10px;
    border-radius: 25px;
    border-style: none;
    font-size: 18px;
}
.buttons {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.discard_button {
    height: 65px;
    width: 200px;
    color: white;
    background-color: rgb(218, 57, 28);
    border-style: none;
    border-radius: 20px;
    font-size: 25px;
    font-weight: bold;
    margin-right: 35px;  
    transition: 0.3s; 
}

.confirm_button {
    height: 65px;
    width: 200px;
    color: white;
    background-color: rgb(34, 139, 34);
    border-style: none;
    border-radius: 20px;
    font-size: 25px;
    font-weight: bold;
    margin-right: 20px;   
    transition: 0.3s;
}

.confirm_button:hover {
    background-color: white;
    color: rgb(34, 139, 34);
}

.discard_button:hover {
    background-color: white;
    color: rgb(218, 57, 28);
}

.p_number,
.donation-placeholder {
    color: black;
    padding-left: 20px;
}

        <div class="container">
            <header class="h1">Donation Form</header>

            <div class="name_container">

                <input class="input_name" type="text" placeholder="last name">
            </div>

            <div class="contacts">
                <div class="phone_number">

                </div>
                <div class="phone_number">
                    <div class="phone">Email Address </div>
                    <input class="p_number" type="text" placeholder="Email Address">   
                </div>
            </div>

            <div class="donation">
                <div class="donation-container">
                    <div class="donation-text"> How much do you wish to donate?</div>
                    <input class="donation-placeholder" type="text" placeholder="Donation Amount">   
                </div>
            </div>

            <div class="donation">
                <div class="donation-container">
                    <div class="donation-text"> Credit Card</div>
                    <input class="donation-placeholder" type="text" placeholder="Card Number #">   
                </div>
            </div>

            <div class="donation">
                <div class="donation-container">
                    <div class="donation-text">billing Address</div>
                    <input class="donation-placeholder" type="text" placeholder="Billing Address">   
                </div>
            </div>
            
            <div class="buttons">
                <button class="discard_button">Discard</button>
                <button class="confirm_button">Confirm</button>
            </div>
        </div>
    </div>
